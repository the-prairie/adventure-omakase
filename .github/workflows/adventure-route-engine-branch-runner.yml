name: Adventure Route Engine Branch Runner

on:
  push:
    branches:
      - feat/adventure-route-engine-osaka
    paths:
      - "adventure-route-engine/**"
      - ".github/workflows/adventure-route-engine-branch-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adventure-route-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: timeout 240s uv run pytest -q --maxfail=20 --durations=20

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adventure-route-engine/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  verify-osaka:
    needs: python-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: adventure-route-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - run: uv sync --all-extras
      - run: sudo apt-get update && sudo apt-get install -y osmium-tool
      - run: make bootstrap-osaka
      - run: make start-valhalla
      - run: make wait-valhalla
      - run: make verify-osaka
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osaka-route-engine-artifacts
          path: |
            adventure-route-engine/artifacts/osaka
            adventure-route-engine/reports
          if-no-files-found: warn
