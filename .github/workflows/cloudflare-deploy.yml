name: Deploy Cloudflare friends
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: preview
        options: [preview, production, restore]
permissions:
  contents: read
concurrency:
  group: cloudflare-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy selected existing environment
    environment: cloudflare-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.22.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm check
      - name: Deploy and verify exact commit through HTTPS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OMAKASE_URL: ${{ vars.OMAKASE_URL }}
          OMAKASE_ENV: ${{ inputs.environment }}
          OMAKASE_PRODUCTION_APPROVED: 'true'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$OMAKASE_URL"
          pnpm --filter @adventure-omakase/friends deploy
