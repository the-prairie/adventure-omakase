name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  API_BASE_URL: http://127.0.0.1:4000
  DATABASE_URL: postgresql://adventure_omakase:local_development_only@127.0.0.1:54320/adventure_omakase
  EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:4000

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start local PostGIS
        run: pnpm infra:up

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build all applications
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run development-server browser tracer
        run: pnpm test:e2e

      - name: Run production-container browser tracer
        run: pnpm test:e2e:production

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local infrastructure
        if: always()
        run: docker compose down --remove-orphans || true
